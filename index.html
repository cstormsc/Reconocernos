<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>¿Cuál es tu mesa?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.15);
    --dark: #0d0d0d;
    --dark2: #141414;
    --dark3: #1c1c1c;
    --text: #f0ead6;
    --text-muted: #7a7060;
    --green: #4caf7d;
    --red: #e05c5c;
  }

  html, body {
    min-height: 100%;
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100svh;
    padding: 0 0 48px;
    background:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(201,168,76,0.12) 0%, transparent 70%),
      var(--dark);
  }

  /* ── Header ── */
  header {
    width: 100%;
    text-align: center;
    padding: 52px 24px 32px;
    position: relative;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    opacity: 0.55;
  }
  .ornament-line {
    height: 1px;
    width: 56px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament-line.r { background: linear-gradient(90deg, var(--gold), transparent); }
  .ornament-diamond {
    width: 6px; height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }
  h1 span {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  /* ── Search card ── */
  .card {
    width: calc(100% - 32px);
    max-width: 480px;
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 20px;
    padding: 28px 24px 24px;
    margin-top: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  label {
    display: block;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.2s;
  }

  input[type="text"] {
    width: 100%;
    background: var(--dark3);
    border: 1.5px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    padding: 14px 14px 14px 44px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  input[type="text"]::placeholder { color: var(--text-muted); }
  input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }
  input[type="text"]:focus + svg,
  .input-wrap:focus-within svg { color: var(--gold); }

  /* fix svg order */
  .input-wrap input { order: 1; }
  .input-wrap svg { order: 2; }

  .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: none;
    line-height: 0;
  }
  .clear-btn.visible { display: block; }

  /* ── Results ── */
  #results {
    margin-top: 20px;
    display: none;
  }
  #results.visible { display: block; }

  .result-divider {
    height: 1px;
    background: rgba(201,168,76,0.1);
    margin-bottom: 18px;
  }

  /* Single match — big reveal */
  .result-single {
    text-align: center;
    animation: fadeUp 0.35s ease both;
  }
  .result-single .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 4vw, 1.25rem);
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .table-reveal {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 16px;
    padding: 20px 40px;
    gap: 4px;
  }
  .table-label {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
  }
  .table-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 14vw, 5rem);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Multiple matches */
  .result-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeUp 0.3s ease both;
  }
  .result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--dark3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    animation: fadeUp 0.3s ease both;
  }
  .result-item:active { background: rgba(201,168,76,0.08); border-color: rgba(201,168,76,0.3); }
  .result-item .item-name {
    font-size: 0.88rem;
    font-weight: 400;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }
  .item-table {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    min-width: 32px;
    text-align: right;
  }
  .item-table-label {
    font-size: 0.6rem;
    color: var(--text-muted);
    text-align: right;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* No result */
  .result-empty {
    text-align: center;
    padding: 12px 0;
    animation: fadeUp 0.3s ease both;
  }
  .result-empty .emoji { font-size: 2rem; margin-bottom: 8px; }
  .result-empty p {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .result-empty strong { color: var(--text); }

  /* Detail overlay for multi-match tap */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    padding: 0 16px 24px;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .overlay-card {
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 24px 24px 20px 20px;
    width: 100%;
    max-width: 480px;
    padding: 32px 28px 28px;
    text-align: center;
    transform: translateY(30px);
    transition: transform 0.3s cubic-bezier(.2,.8,.4,1);
  }
  .overlay.open .overlay-card { transform: translateY(0); }
  .overlay-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .overlay-table-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 16px;
    padding: 18px 48px;
    gap: 2px;
    margin-bottom: 24px;
  }
  .overlay-table-label { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
  .overlay-table-num {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay-close {
    background: var(--dark3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 12px 24px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
  }
  .overlay-close:active { background: rgba(255,255,255,0.06); }

  /* Footer */
  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <div class="ornament">
    <div class="ornament-line"></div>

  <h1>¿Cuál es tu<br><span>mesa?</span></h1>

<div class="overlay" id="overlay" role="dialog">

function norm(s) {
  return s.toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ').trim();
}

const input    = document.getElementById('search');
const results  = document.getElementById('results');
const clearBtn = document.getElementById('clearBtn');
const overlay  = document.getElementById('overlay');
const overlayName  = document.getElementById('overlayName');
const overlayTable = document.getElementById('overlayTable');
const overlayClose = document.getElementById('overlayClose');

function highlight(text, query) {
  const nText = norm(text), nQuery = norm(query);
  const idx = nText.indexOf(nQuery);
  if (idx === -1) return escHtml(text);
  return escHtml(text.slice(0, idx))
    + '<mark style="background:rgba(201,168,76,0.25);color:inherit;border-radius:3px;">'
    + escHtml(text.slice(idx, idx + query.length))
    + '</mark>'
    + escHtml(text.slice(idx + query.length));
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(query) {
  const q = norm(query.trim());
  if (q.length < 2) { results.className = ''; results.innerHTML = ''; return; }

  const hits = GUESTS.filter(g => norm(g.name).includes(q));
  results.className = 'visible';

    results.innerHTML = `

      <div class="result-empty">
        <div class="emoji">🔍</div>
        <p>No encontramos a <strong>"${escHtml(query.trim())}"</strong>.<br>Intenta con otro apellido o verifica la ortografía.</p>
      </div>`;
    return;
  }

  if (hits.length === 1) {
    results.innerHTML = `
      <div class="result-divider"></div>
      <div class="result-single">
        <div class="name">${highlight(hits[0].name, query.trim())}</div>
        <div class="table-reveal">
          <span class="table-label">Mesa</span>
          <span class="table-number">${hits[0].table}</span>
        </div>
      </div>`;
    return;
  }

  const items = hits.map((g, i) => `
    <div class="result-item" style="animation-delay:${i * 0.04}s" onclick="showDetail('${escHtml(g.name.replace(/'/g,"\\'"))}', ${g.table})">
      <div class="item-name">${highlight(g.name, query.trim())}</div>
      <div>
        <div class="item-table">${g.table}</div>
        <div class="item-table-label">mesa</div>
      </div>
    </div>`).join('');

  results.innerHTML = `
    <div class="result-divider"></div>
    <div class="result-list">${items}</div>`;
}

function showDetail(name, table) {
  overlayName.textContent = name;
  overlayTable.textContent = table;
  overlay.classList.add('open');
}

input.addEventListener('input', () => {
  clearBtn.classList.toggle('visible', input.value.length > 0);
  render(input.value);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('visible');
  results.className = '';
  results.innerHTML = '';
  input.focus();
});

overlayClose.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
</script>
</body>
</html>
